[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# colab-rl-bridge — eigenständiges PyPI-Paket für colab_bridge/
# Publiziert als: pip install colab-rl-bridge
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "colab-rl-bridge"
version = "1.0.0"
description = "Kommunikations-Bridge zwischen lokalem Rechner und Google Colab / Cloud RL-Training"
readme = "colab_bridge/DOKUMENTATION.md"
license = {file = "LICENSE"}
authors = [
    {name = "juancarlosrial76-code", email = "juancarlosrial76@users.noreply.github.com"}
]
keywords = [
    "reinforcement-learning", "google-colab", "trading", "rl-bridge",
    "paper-trading", "ably", "colab-extension"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"

# Pflicht-Abhängigkeiten (nur was colab_bridge wirklich braucht)
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "loguru>=0.7",
    "httpx>=0.24",
]

[project.optional-dependencies]
# Lokaler Rechner (Module A)
local = [
    "ably>=3.1",
    "ccxt>=4.0",
]
# Colab / Cloud (Module B)
colab = [
    "ably>=3.1",
]
# Control-Plane (FastAPI-Server)
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.24",
]
# RL-Modelle
torch = [
    "torch>=2.0",
]
sb3 = [
    "stable-baselines3>=2.0",
]
# Alles zusammen
all = [
    "ably>=3.1",
    "ccxt>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.24",
    "torch>=2.0",
]
# Entwicklung
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "black>=23.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/juancarlosrial76-code/BITCOIN4Traders"
Repository = "https://github.com/juancarlosrial76-code/BITCOIN4Traders"
Documentation = "https://github.com/juancarlosrial76-code/BITCOIN4Traders/blob/main/colab_bridge/DOKUMENTATION.md"
"Bug Tracker" = "https://github.com/juancarlosrial76-code/BITCOIN4Traders/issues"

[project.scripts]
# CLI-Befehle nach pip install
bt4t-local   = "colab_bridge.module_a_local:main"
bt4t-colab   = "colab_bridge.module_b_colab:main"
bt4t-server  = "colab_bridge.control_plane:_cli_server"
bt4t-tunnel  = "colab_bridge.control_plane:_cli_tunnel"

# ─────────────────────────────────────────────────────────────────────────────
# Setuptools: welche Packages ins Paket kommen
# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
include = ["colab_bridge*"]   # nur colab_bridge/ und colab_bridge/transports/

[tool.setuptools.package-data]
"colab_bridge" = ["*.md"]

# ─────────────────────────────────────────────────────────────────────────────
# Entwickler-Tools
# ─────────────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/colab_bridge"]
