[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin4traders"
version = "2.0.0"
description = "Institutional-Grade Bitcoin Trading System with Deep Reinforcement Learning"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "BITCOIN4Traders Team"}
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "torch>=2.0",
    "pandas>=2.0",
    "loguru>=0.7",
    "ccxt>=4.0",
    "fastapi>=0.100",
    "scipy>=1.11",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "colab_bridge*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__ re-export files
"__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "numba.*",
    "ccxt.*",
    "gymnasium.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
